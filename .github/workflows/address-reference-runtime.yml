name: Address reference runtime

on:
  push:
    paths:
      - 'address/reference-runtime-v0.1/**'
      - '.github/workflows/address-reference-runtime.yml'
  pull_request:
    paths:
      - 'address/reference-runtime-v0.1/**'
      - '.github/workflows/address-reference-runtime.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reference-runtime tests
        run: python -m unittest discover -s address/reference-runtime-v0.1/tests -v
